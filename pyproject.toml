[project]
name = "it-helpdesk-agent"
version = "0.1.0"
description = "Conversational IT support agent that diagnoses, resolves, and escalates with full context."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
itagent = "agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
